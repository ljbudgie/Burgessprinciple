# Aider configuration for the Burgess Principle repository.
#
# Thin shim. The canonical AI-facing files are AGENTS.md (for coding agents)
# and FOR_AI_MODELS.md (for models replying to a user). Both are loaded into
# the chat by default so Aider sees the rules and the doctrine on every run.
#
# Not loaded by default, but read them before proposing a change:
#   TIERS.md      — Core / Toolkit / Extensions, the admission rule, review bars
#   NAVIGATION.md — the full index of the repository, by reader type

read:
  - AGENTS.md
  - FOR_AI_MODELS.md
